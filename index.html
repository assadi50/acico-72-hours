<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>72 Hours at the Plant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  /* ACICO Group palette: signature orange + industrial grey on warm concrete. Layout: top command bar, scene canvas, crisis-team dock. */
  --orange:#E06931; --orange-d:#B9501F; --orange-l:#FCEDE4;
  --grey:#818181; --ink:#262626; --sub:#5d5d5d;
  --bg:#F4F2EF; --card:#FFFFFF; --line:#E4DFD8; --soft:#F8F6F3;
  --safety:#E06931; --trust:#5B6D80; --cont:#2F9283;
  --good:#2E9E6B; --warn:#D99A16; --bad:#D04437;
  --font:"Readex Pro","Segoe UI",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;
  background-image:linear-gradient(rgba(0,0,0,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,.025) 1px,transparent 1px);background-size:28px 28px}
button,input,select{font-family:inherit;font-size:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
h1,h2,h3,h4{margin:0;text-wrap:balance}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);border-top:4px solid var(--orange);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:12px;padding:10px 18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:44px;height:44px;border-radius:50%;background:var(--orange);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;letter-spacing:.5px}
.brand b{display:block;font-size:19px;line-height:1.1}
.brand small{color:var(--grey);font-size:12px}
.dots{display:flex;gap:8px;align-items:center}
.dot{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font:600 11px var(--mono);color:var(--grey);background:#fff}
.dot.now{background:var(--orange);border-color:var(--orange);color:#fff;box-shadow:0 0 0 4px var(--orange-l)}
.dot.done{background:var(--ink);border-color:var(--ink);color:#fff}
.sp{flex:1}
.clockbox{display:flex;align-items:center;gap:8px;font:600 22px var(--mono)}
.clockbox small{font:500 11px var(--font);color:var(--grey);display:block;line-height:1.1;text-align:right}
.clockbox.hot{color:var(--bad)}
.rings{display:flex;gap:10px}
.ring{display:flex;align-items:center;gap:8px}
.ring svg{display:block}
.ring b{font:600 18px var(--mono);display:block;line-height:1}
.ring small{font-size:11px;color:var(--sub)}
.pill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;display:flex;gap:6px;align-items:center}
.pill b{font-family:var(--mono);color:var(--orange)}
.iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;color:var(--sub)}

/* ---------- layout ---------- */
main{max-width:1320px;margin:0 auto;padding:22px 22px 130px}
.grid2{display:grid;grid-template-columns:1.1fr 1fr;gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px}
.eyebrow{font-size:12.5px;color:var(--orange-d);font-weight:600;letter-spacing:.3px}
.muted{color:var(--sub)}
.mono{font-family:var(--mono)}

/* intro hero */
.hero{display:grid;grid-template-columns:1fr 330px;gap:10px;align-items:center;position:relative;overflow:hidden;background:linear-gradient(135deg,#fff 0%,#fff 55%,var(--orange-l) 100%)}
.hero h1{font-size:52px;line-height:.98;font-weight:700;letter-spacing:-1px;margin:8px 0 14px}
.hero h1 em{font-style:normal;color:var(--orange)}
.hero p{max-width:56ch;color:var(--sub);font-size:16.5px;margin:0}
.memo{font-size:15px}
.memo .hdr{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;font-size:13px;color:var(--sub);border-bottom:1px dashed var(--line);padding-bottom:10px;margin-bottom:12px}
.memo ol{padding-left:22px;margin:10px 0}
.memo li{margin:6px 0}
.memo li::marker{color:var(--orange);font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:18px}
.tile{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.tile b{font:600 30px var(--mono);display:block;letter-spacing:-.5px}
.tile b small{font-size:14px;color:var(--grey);margin-left:3px}
.tile span{font-size:13px;color:var(--sub)}
.seats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:12px}
.seat{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff}
.seat .av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;margin-bottom:8px}
.seat b{display:block;font-size:15px}
.seat p{margin:4px 0 0;font-size:13px;color:var(--sub)}
.seat input{margin-top:10px;width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:13px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:#fff}
.seg button{border:0;background:none;padding:7px 14px;border-radius:999px;color:var(--sub)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.startrow{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:18px}
.btn{border:0;border-radius:12px;background:var(--orange);color:#fff;padding:14px 24px;font-weight:600;font-size:16px;display:inline-flex;gap:10px;align-items:center}
.btn:hover{background:var(--orange-d)}
.btn.dark{background:var(--ink)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{background:#cfcac4;cursor:not-allowed}

/* scene header */
.shead{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;flex-wrap:wrap;margin-bottom:16px}
.shead h2{font-size:40px;line-height:1.05;font-weight:700;letter-spacing:-.5px}
.shead p{max-width:70ch;margin:8px 0 0;color:var(--sub);font-size:16px}
.own{display:flex;gap:8px;flex-wrap:wrap}
.own span{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;display:flex;align-items:center;gap:6px}
.own i{width:8px;height:8px;border-radius:50%;display:inline-block}
.alert{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-left:5px solid var(--bad);border-radius:12px;padding:12px 14px;margin-bottom:14px}
.alert b{font:600 12px var(--mono);color:var(--bad);white-space:nowrap;padding-top:2px}
.alert.info{border-left-color:var(--orange)}.alert.info b{color:var(--orange)}

/* generic blocks */
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}
.panel h4{font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.panel h4 small{font-weight:400;color:var(--grey);font-size:12px}
.cols3{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:16px}
.chipq{display:grid;gap:8px}
.ask{display:flex;justify-content:space-between;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--soft);border-radius:10px;padding:10px 12px;color:var(--ink)}
.ask:hover:not(:disabled){border-color:var(--orange)}
.ask small{font:600 11px var(--mono);color:var(--bad)}
.ask:disabled{cursor:default;background:#fff}
.reveal{font-size:13.5px;background:var(--orange-l);border-radius:8px;padding:8px 10px;margin-top:-2px;animation:pop .35s}
@keyframes pop{from{transform:scale(.97);opacity:.2}}

.token{user-select:none;touch-action:none;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;font-size:14px;cursor:grab;display:flex;gap:8px;align-items:center;transition:box-shadow .15s,border-color .15s}
.token:hover{border-color:var(--orange)}
.token.sel{border-color:var(--orange);box-shadow:0 0 0 3px var(--orange-l)}
.token .tag{font:600 10.5px var(--mono);color:var(--grey);margin-left:auto}
.slot{border:1.5px dashed #d5cec5;border-radius:12px;min-height:50px;padding:6px;display:flex;flex-direction:column;gap:6px;transition:background .15s,border-color .15s}
.slot.over,.slot.armed{border-color:var(--orange);background:var(--orange-l)}
.slot .ph{color:#aaa39a;font-size:13px;text-align:center;padding:10px}
.slotlabel{font-size:13px;font-weight:600;margin-bottom:6px;display:flex;justify-content:space-between}
.slotlabel small{color:var(--grey);font-weight:400}

.hold{position:relative;overflow:hidden;border:0;border-radius:12px;background:var(--ink);color:#fff;padding:15px 22px;font-weight:600;font-size:16px;min-width:260px}
.hold i{position:absolute;inset:0;width:0;background:var(--orange);transition:width .05s linear}
.hold span{position:relative}
.hold small{display:block;font-weight:400;font-size:11.5px;opacity:.75;position:relative}
.hold:disabled{background:#cfcac4}
.foot{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-top:18px}
.foot .muted{font-size:14px}

/* map */
.map{width:100%;height:auto;display:block;border-radius:12px;background:#EEEAE4}
.steam{animation:steam 3s ease-out infinite;transform-origin:center}
@keyframes steam{0%{opacity:.75;transform:scale(.6)}100%{opacity:0;transform:scale(1.7)}}
.blink{animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}
.prog{height:8px;background:var(--soft);border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.prog i{display:block;height:100%;background:var(--orange);transition:width .5s}
.rank{display:grid;gap:6px}
.rank .token{cursor:default}
.rank .mv{margin-left:auto;display:flex;gap:4px}
.rank .mv button{border:1px solid var(--line);background:#fff;border-radius:6px;width:26px;height:26px;padding:0;font-size:12px}
.rank .n{font:600 12px var(--mono);color:#fff;background:var(--ink);border-radius:6px;width:22px;height:22px;display:grid;place-items:center;flex:none}
.toggles{display:grid;gap:8px}
.tog{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--soft);font-size:14px}
.tog input{accent-color:var(--orange);width:18px;height:18px}

/* sort columns */
.sortgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.sortcol{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}
.sortcol h5{margin:0 0 4px;font-size:15px}
.sortcol p{margin:0 0 8px;font-size:12.5px;color:var(--sub)}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.pool .token{flex:1 1 280px}
.why{font-size:12px;color:var(--sub);padding:0 4px 2px}
.token.ok{border-color:var(--good);background:#eef8f2}.token.no{border-color:var(--bad);background:#fbeceb}

/* statement */
.phone{background:var(--ink);border-radius:26px;padding:12px;color:#fff}
.phone .scr{background:#fff;color:var(--ink);border-radius:16px;padding:14px;min-height:320px}
.views{font:600 32px var(--mono);color:var(--bad)}
.feeditem{border-bottom:1px solid var(--line);padding:8px 0;font-size:13.5px}
.feeditem b{font-size:12px;color:var(--grey);display:block}
.qa{display:grid;gap:8px}
.qa button{text-align:left;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px}
.qa button:hover:not(:disabled){border-color:var(--orange)}
.qa button.pick{border-color:var(--orange);background:var(--orange-l)}

/* allocation */
.cust{display:grid;grid-template-columns:1.4fr 1.3fr 1fr;gap:14px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:#fff}
.cust b{display:block}
.cust small{color:var(--sub);font-size:12.5px}
.cust input[type=range]{width:100%;accent-color:var(--orange)}
.cust select{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px;background:#fff}
.capbar{display:flex;height:22px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--soft)}
.capbar i{display:block;height:100%}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--sub);margin-top:6px}
.legend i{width:10px;height:10px;display:inline-block;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* negotiation */
.gauge text{font:500 11px var(--font);fill:var(--sub)}
.person{display:flex;gap:12px;align-items:center}
.person .av{width:54px;height:54px;border-radius:50%;background:var(--trust);color:#fff;display:grid;place-items:center;font-weight:700}
.bubble{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:15px;position:relative;margin-top:10px}
.interests{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.interests span{font-size:12.5px;border-radius:999px;padding:4px 10px;background:#eef2f6;color:var(--trust)}
.interests span.hidden{background:var(--soft);color:#b2aba3;border:1px dashed #d5cec5}

/* outcomes */
.outc{display:grid;gap:8px}
.oc{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;animation:pop .4s backwards}
.oc i{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-style:normal;font-weight:700;font-size:13px}
.oc.g i{background:var(--good)}.oc.b i{background:var(--bad)}.oc.m i{background:var(--warn)}
.oc b{display:block;font-size:14.5px}
.oc small{color:var(--sub)}
.deltas{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.deltas span{font:600 13px var(--mono);border-radius:8px;padding:5px 10px;background:var(--soft);border:1px solid var(--line)}
.overlay{position:fixed;inset:0;background:rgba(30,26,22,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.overlay.on{display:flex}
.modal{background:#fff;border-radius:20px;max-width:760px;width:100%;max-height:90vh;overflow:auto;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal h3{font-size:24px;margin-bottom:4px}
.picks{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px}
.picks button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-size:13.5px}
.picks button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}

/* dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding:10px 22px;display:flex;gap:10px;align-items:center;overflow-x:auto}
.dock .lab{font-size:12px;color:var(--grey);white-space:nowrap}
.dk{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:14px;padding:8px 14px;background:#fff;white-space:nowrap}
.dk .av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:11px}
.dk b{display:block;font-size:13.5px;line-height:1.2}
.dk small{font-size:11.5px;color:var(--grey)}
.dk.owner{border:2px solid var(--orange);background:var(--orange-l)}
.dk.owner small{color:var(--orange-d);font-weight:600}
.dk.appr{border-color:var(--ink)}

/* results */
.score{font:700 96px/1 var(--mono);color:var(--orange);letter-spacing:-3px}
.verdict{font-size:26px;font-weight:700}
.comp{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.cp{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff}
.cp .bar{height:8px;border-radius:6px;background:var(--soft);overflow:hidden;margin:8px 0}
.cp .bar i{display:block;height:100%}
.cp small{color:var(--sub);font-size:12.5px}
.tl{display:grid;gap:8px}
.tlr{display:grid;grid-template-columns:110px 1fr 110px;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:#fff}
.tlr .g{font:600 13px var(--mono);text-align:right}
.cm{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding:9px 0;font-size:14px}
.cm:last-child{border:0}
.badge{font:600 11px var(--mono);border-radius:999px;padding:3px 9px;white-space:nowrap;height:fit-content}
.badge.k{background:#e5f4ec;color:var(--good)}.badge.r{background:#fbeceb;color:var(--bad)}.badge.p{background:#fdf3dc;color:#9a6c0c}

.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
@media (max-width:1100px){.grid2,.hero,.cols3{grid-template-columns:1fr}.tiles,.seats{grid-template-columns:repeat(2,1fr)}.sortgrid{grid-template-columns:1fr 1fr}.cust{grid-template-columns:1fr}.comp{grid-template-columns:1fr 1fr}.hero h1{font-size:48px}.rings{order:5}}
@media (max-width:560px){.sortgrid,.comp,.tiles,.seats{grid-template-columns:1fr}.shead h2{font-size:30px}.tlr{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><div class="logo">ACICO</div><div><b>72 Hours at the Plant</b><small>Crisis management simulation &middot; prepared for ACICO Group</small></div></div>
  <div class="dots" id="dots" aria-label="Scenes"></div>
  <div class="sp"></div>
  <div class="pill" title="Commitments made in ACICO's name">Commitments <b id="cmtCount">0</b></div>
  <div class="clockbox" id="clockbox"><span>&#9719;</span><span id="clock">--:--</span><small id="clockLab">suggested<br>time</small></div>
  <div class="rings" id="rings"></div>
  <button class="iconbtn" id="snd" aria-label="Toggle sound" title="Sound">&#128266;</button>
  <button class="iconbtn" id="fs" aria-label="Full screen" title="Full screen">&#x26F6;</button>
</header>

<main id="main"></main>
<div class="dock" id="dock"></div>
<div class="overlay" id="ov"><div class="modal" id="modal"></div></div>

<script>
(function(){
"use strict";
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ================= DATA ================= */
const SEATS=[
 {id:"CL",name:"Crisis Lead",tier:"Strategic",col:"#E06931",desc:"Chairs the Crisis Management Team, sets priorities and faces the Board."},
 {id:"IC",name:"Site Incident Commander",tier:"Operational",col:"#262626",desc:"Runs the response on the plant floor until the authorities take over."},
 {id:"CM",name:"Communications Lead",tier:"Tactical",col:"#5B6D80",desc:"Owns every word ACICO says to staff, families, media and customers."},
 {id:"OS",name:"Operations & Supply Lead",tier:"Tactical",col:"#2F9283",desc:"Protects production, stock and customer commitments."},
 {id:"PH",name:"People & HSE Lead",tier:"Tactical",col:"#8C6BB1",desc:"Looks after the injured, their families, the shift team and the regulators."}
];
const SCENES=[
 {n:1,key:"command",title:"First Response",at:"T+00:00 · Sun 02:47",skill:"Decisions under pressure",owner:"IC",appr:"CL",mins:4,hard:true},
 {n:2,key:"structure",title:"Who Decides What",at:"T+01:00 · Sun 03:47",skill:"Crisis team structure",owner:"CL",appr:null,mins:6},
 {n:3,key:"statement",title:"The Video",at:"T+03:00 · Sun 05:47",skill:"Crisis communication",owner:"CM",appr:"CL",mins:4,hard:true},
 {n:4,key:"supply",title:"Supply on the Line",at:"T+08:00 · Sun 10:47",skill:"Business continuity",owner:"OS",appr:"CL",mins:7},
 {n:5,key:"bank",title:"The Bank Calls",at:"T+24:00 · Mon 02:47",skill:"Stakeholder confidence",owner:"CL",appr:"PH",mins:6}
];
const RINGS=[["safety","Safety","var(--safety)","#E06931"],["trust","Trust","var(--trust)","#5B6D80"],["cont","Continuity","var(--cont)","#2F9283"]];

/* ================= STATE ================= */
let S={scene:-1,mode:"team",team:"Team 1",names:{},rings:{safety:50,trust:50,cont:50},commit:[],results:[],facts:{},sound:true};
let tick=null, left=0;

/* ================= AUDIO ================= */
let actx=null;
function beep(f=660,d=.18,type="sine",v=.05){ if(!S.sound)return; try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,actx.currentTime);g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+d);o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+d);}catch(e){} }
const alarm=()=>{beep(880,.2,"square");setTimeout(()=>beep(660,.2,"square"),230);setTimeout(()=>beep(880,.2,"square"),460)};
const okS=()=>{beep(523,.12,"triangle");setTimeout(()=>beep(784,.18,"triangle"),120)};
const badS=()=>beep(196,.3,"sawtooth",.04);

function startClock(mins,hard,onEnd){
  clearInterval(tick); left=Math.round(mins*60); const cb=$("#clockbox"); cb.classList.remove("hot");
  $("#clockLab").innerHTML=hard?"scene<br>deadline":"suggested<br>time";
  const draw=()=>{const m=Math.floor(Math.max(left,0)/60),s=Math.max(left,0)%60;$("#clock").textContent=`${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;};
  draw();
  tick=setInterval(()=>{left--;draw(); if(hard&&left<=30){cb.classList.add("hot"); if(left<=10&&left>0)beep(1000,.06);} if(left<=0){ if(hard){clearInterval(tick); onEnd&&onEnd();} else if(left<-600)clearInterval(tick);} },1000);
}
function spend(sec){left-=sec;}
function stopClock(){clearInterval(tick);}

function holdBtn(id,label,sub){return `<button class="hold" id="${id}"><i></i><span>${label}</span><small>${sub||"press and hold to approve"}</small></button>`}
function wireHold(id,done){
  const b=document.getElementById(id); if(!b)return; let t=null,st=0; const bar=b.querySelector("i");
  const down=e=>{ if(b.disabled)return; e.preventDefault(); st=performance.now(); t=setInterval(()=>{const p=Math.min(1,(performance.now()-st)/1100);bar.style.width=(p*100)+"%"; if(p>=1){clearInterval(t);t=null;b.disabled=true;okS();done();}},30);};
  const up=()=>{ if(t){clearInterval(t);t=null;bar.style.width="0";} };
  b.addEventListener("pointerdown",down); ["pointerup","pointerleave","pointercancel"].forEach(ev=>b.addEventListener(ev,up));
  b.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&!b.disabled){e.preventDefault();b.disabled=true;okS();done();}});
}

/* ================= DRAG / TAP-TO-PLACE ================= */
let selected=null;
function dnd(root,onChange,opts={}){
  const max=opts.max||{};
  root.querySelectorAll(".token[data-id]").forEach(t=>{
    t.draggable=true;
    t.addEventListener("dragstart",e=>{e.dataTransfer.setData("text/plain",t.dataset.id);t.classList.add("sel");});
    t.addEventListener("dragend",()=>t.classList.remove("sel"));
    t.addEventListener("click",e=>{ const ps=t.parentElement; if(selected&&selected!==t&&ps._put&&ps.dataset.slot!=="pool"){e.stopPropagation();ps._put(selected.dataset.id);return;} if(selected===t){t.classList.remove("sel");selected=null;root.querySelectorAll(".slot").forEach(s=>s.classList.remove("armed"));return;}
      root.querySelectorAll(".token.sel").forEach(x=>x.classList.remove("sel")); selected=t;t.classList.add("sel"); root.querySelectorAll(".slot").forEach(s=>s.classList.add("armed")); });
  });
  root.querySelectorAll(".slot").forEach(sl=>{
    const put=id=>{ const t=root.querySelector(`.token[data-id="${id}"]`); if(!t)return; const lim=+sl.dataset.max||max[sl.dataset.slot]||99;
      const cur=sl.querySelectorAll(".token").length; if(cur>=lim&&t.parentElement!==sl){ const first=sl.querySelector(".token"); const pool=root.querySelector(".slot[data-slot='pool']"); if(first&&pool){pool.appendChild(first);} else {sl.classList.add("shake");setTimeout(()=>sl.classList.remove("shake"),400);return;} }
      sl.appendChild(t); t.classList.remove("sel"); selected=null; root.querySelectorAll(".slot").forEach(s=>s.classList.remove("armed")); refreshPh(root); beep(560,.06,"triangle",.03); onChange&&onChange(); };
    sl._put=put;
    sl.addEventListener("dragover",e=>{e.preventDefault();sl.classList.add("over");});
    sl.addEventListener("dragleave",()=>sl.classList.remove("over"));
    sl.addEventListener("drop",e=>{e.preventDefault();sl.classList.remove("over");put(e.dataTransfer.getData("text/plain"));});
    sl.addEventListener("click",e=>{ if(selected&&!e.target.closest(".token")) put(selected.dataset.id); });
  });
  refreshPh(root);
}
function refreshPh(root){ root.querySelectorAll(".slot").forEach(sl=>{ const has=sl.querySelector(".token"); let ph=sl.querySelector(".ph"); if(!has&&!ph){ph=document.createElement("div");ph.className="ph";ph.textContent=sl.dataset.ph||"Drop here";sl.appendChild(ph);} if(has&&ph)ph.remove(); }); }
const inSlot=(root,slot)=>[...root.querySelectorAll(`.slot[data-slot="${slot}"] .token`)].map(t=>t.dataset.id);

    $("#rv-"+i.id).innerHTML=`<div class="reveal">${esc(i.a)}</div>`; const p=asked.size/4*100;$("#pct").style.width=p+"%";$("#pctTxt").textContent=p+"%";

  dnd($("#assign"));

    const must=(document.querySelector("input[name=must]:checked")||{}).value;

    const rescued=a.rescue==="fire"||(a.rescue==="aid"&&c112);

function decisionLog(r){
  const KN=[["k1","Three people were unaccounted for",true],["k2","Autoclaves 1 and 2 were pressurised",S.facts.asked.includes("press")],["k3","The plume was heading to the accommodation",S.facts.asked.includes("wind")],["k4","The cause was operator error",false],["k5","Nobody was inside Hall B",false]];

   <b style="font-size:14px">What I knew for certain</b><div class="picks" id="pk">${KN.map(k=>`<button data-k="${k[0]}" aria-pressed="false">${k[1]}</button>`).join("")}</div>

   <div class="foot"><span class="muted">Only record as certain what you actually confirmed.</span><button class="btn" id="logIt">Record the decision</button></div>`;
  $("#ov").classList.add("on");

  $$("#rv button").forEach(b=>b.onclick=()=>{$$("#rv button").forEach(x=>x.setAttribute("aria-pressed","false"));b.setAttribute("aria-pressed","true");});
  $("#logIt").onclick=()=>{
    const chosen=$$("#pk button[aria-pressed=true]").map(b=>b.dataset.k); const rev=($("#rv button[aria-pressed=true]")||{dataset:{}}).dataset.r;
    let wrong=0,right=0; KN.forEach(k=>{const c=chosen.includes(k[0]); if(c&&k[2])right++; if(c&&!k[2])wrong++;});
    if(wrong){r.fx.trust-=4*wrong;r.lines.push(["b",`${wrong} assumption${wrong>1?"s":""} logged as fact`,"Investigators flagged the log; speculation about cause is a serious liability."]);}
    else if(right>=2){r.fx.trust+=4;r.lines.push(["g","A clean, factual decision log","Known facts separated from assumptions."]);}
    if(rev==="15"){r.fx.safety+=2;r.lines.push(["g","Review set for 15 minutes","You caught the change in wind at 03:05."]);} else {r.fx.safety-=2;r.lines.push(["m","No early review point","Fast-moving incidents need decisions revisited."]);}
    $("#ov").classList.remove("on");
    finishScene({fx:r.fx,lines:r.lines,head:r.fx.safety>=20?"The site is under control":"The site is safe, at a cost",sub:"Hall B is closed. Both injured operators are in hospital.",lesson:"Life safety first, then stop escalation, then protect the community, then the business. Information is worth its time only when it changes a decision; record facts and assumptions separately."});
  };
}

   ["b","A minor technical issue occurred, with no impact on operations.","what",-3],

   <div class="panel" id="stp"><h4>Holding statement builder <small>one block per section</small></h4>

     <div class="slot" data-slot="pool" data-ph="All blocks used">${BLOCKS.map(b=>`<div class="token" data-id="${b[0]}" style="font-size:13.5px">${esc(b[1])}</div>`).join("")}</div>
     <h4 style="margin-top:16px">Release to</h4>
     <div class="toggles" style="grid-template-columns:1fr 1fr">
      <label class="tog"><input type="checkbox" id="chStaff"> Staff &amp; families first</label><label class="tog"><input type="checkbox" id="chCust"> Customers</label>
      <label class="tog"><input type="checkbox" id="chMedia"> Media</label><label class="tog"><input type="checkbox" id="chSocial"> Group social channels</label></div>
   </div>
   <div>
    <div class="phone"><div class="scr">

  </div>

  $("#main").innerHTML=sceneHead(sc,"Engineers estimate 10 days to repair Autoclave 3 and certify Hall B. You have 4 days of stock and spare capacity at a sister plant, but customers are owed 5,700 m³ in the next two weeks. Allocate what you have, decide what to promise, and set the restart.")+
  `<div class="alert info"><b>10:47 EMAIL</b><span>Main contractor&rsquo;s project director: &ldquo;Our crews are booked for block work from Thursday. I need a confirmed plan today.&rdquo;</span></div>
  <div class="panel"><h4>Available supply, next 14 days <small><span id="used">0</span> of ${CAP.toLocaleString()} m&sup3; allocated</small></h4>
    <div class="capbar" id="cap"></div>
    <div class="legend"><span><i style="background:#E06931"></i>Main contractor</span><span><i style="background:#5B6D80"></i>Ministry</span><span><i style="background:#2F9283"></i>Dealers</span><span><i style="background:#8C6BB1"></i>ACICO Homes</span><span>Supply: 2,400 m&sup3; stock + 1,800 m&sup3; sister plant</span></div>
  </div>
  <div style="display:grid;gap:10px;margin-top:14px">${CUST.map(c=>`<div class="cust"><div><b>${c[1]}</b><small>${c[2]} &middot; needs <span class="mono">${c[3].toLocaleString()}</span> m&sup3;</small></div>
     <div><input type="range" min="0" max="${c[3]}" step="100" value="0" id="r-${c[0]}" aria-label="Allocation for ${c[1]}"><div class="slotlabel"><small><span class="mono" id="v-${c[0]}">0</span> m&sup3; &middot; <span id="p-${c[0]}">0</span>%</small></div></div>
     <div><select id="m-${c[0]}" aria-label="Message to ${c[1]}"><option value="">What do you tell them?</option><option value="full">Confirm full volume on time</option><option value="phase">Phased schedule with firm dates</option><option value="fm">Pause under force majeure</option></select></div></div>`).join("")}</div>
  <div class="grid2" style="margin-top:14px"><div class="panel"><h4>Restart of Line 2 and Hall B</h4><div class="toggles">
    <label class="tog"><input type="radio" name="rs" value="48"> Restart Line 2 at T+48h, after the safety sign-off</label>
    <label class="tog"><input type="radio" name="rs" value="24"> Restart Line 2 at T+24h, sign-off to follow</label>
    <label class="tog"><input type="radio" name="rs" value="hold"> Keep everything stopped until Hall B is repaired</label></div></div>
   <div class="panel"><h4>Plan check <small>updates as you change the plan</small></h4><div id="chk" class="outc"></div></div></div>
  <div class="foot"><span class="muted">Every promise you choose is logged as a commitment in ACICO&rsquo;s name.</span>${holdBtn("approve4","Approve the supply plan")}</div>`;
  const colors={gov:"#E06931",min:"#5B6D80",deal:"#2F9283",homes:"#8C6BB1"};
  const upd=()=>{ let used=0; CUST.forEach(c=>{const v=+$("#r-"+c[0]).value;used+=v;$("#v-"+c[0]).textContent=v.toLocaleString();$("#p-"+c[0]).textContent=Math.round(v/c[3]*100);});
    $("#used").textContent=used.toLocaleString(); $("#used").style.color=used>CAP?"var(--bad)":"";
    $("#cap").innerHTML=CUST.map(c=>`<i style="width:${+$("#r-"+c[0]).value/Math.max(CAP,used)*100}%;background:${colors[c[0]]}"></i>`).join("");
    const ch=[]; if(used>CAP)ch.push(["b",`Over capacity by ${(used-CAP).toLocaleString()} m³`,"This plan cannot be delivered."]);
    CUST.forEach(c=>{const v=+$("#r-"+c[0]).value,m=$("#m-"+c[0]).value; if(m==="full"&&v<c[3])ch.push(["b",`Promising ${c[1].split(" ·")[0]} full volume`,`Only ${v.toLocaleString()} of ${c[3].toLocaleString()} m³ allocated.`]);});
    const rs=(document.querySelector("input[name=rs]:checked")||{}).value; if(rs==="24")ch.push(["b","Restart before safety sign-off","Inspectors have not cleared the site."]);
    if(!ch.length)ch.push(["g","No conflicts in the plan so far",""]);
    $("#chk").innerHTML=ch.map(l=>`<div class="oc ${l[0]}"><i>${l[0]==="g"?"&#10003;":"!"}</i><div><b>${esc(l[1])}</b><small>${esc(l[2])}</small></div></div>`).join(""); return used; };
  CUST.forEach(c=>{$("#r-"+c[0]).oninput=upd;$("#m-"+c[0]).onchange=upd;}); $$("input[name=rs]").forEach(r=>r.onchange=upd); upd();
  wireHold("approve4",()=>{
    const used=upd(); const fx={safety:0,trust:0,cont:0},lines=[];
    const al=k=>+$("#r-"+k).value, msg=k=>$("#m-"+k).value;
    if(used>CAP){fx.cont-=8;fx.trust-=6;lines.push(["b","The plan exceeds what the Group can make","Shortfalls appear on day 5."]);}
    const crit=(al("gov")/3000+al("min")/900)/2; fx.cont+=Math.round((crit-.6)*20);
    lines.push([crit>=.8?"g":crit>=.6?"m":"b",`Critical customers covered at ${Math.round(crit*100)}%`,crit>=.8?"Government projects keep moving.":"Government projects slip, and penalties start."]);
    if(al("homes")>=300){fx.trust+=3;lines.push(["g","ACICO Homes families protected","Private homeowners mid-build were not left without blocks."]);}
    let broken=0; CUST.forEach(c=>{const m=msg(c[0]),v=al(c[0]);
      if(m==="full"){addCommit(`Full ${c[3].toLocaleString()} m³ on time to ${c[1].split(" ·")[0]}`,4,v>=c[3]?"kept":"broken"); if(v<c[3])broken++;}
      else if(m==="phase"){addCommit(`Phased schedule with firm dates to ${c[1].split(" ·")[0]}`,4,v>0?"kept":"broken"); fx.trust+=2;}
      else if(m==="fm"){fx.trust-=c[4]?4:2;lines.push(["m",`Force majeure to ${c[1].split(" ·")[0]}`,c[4]?"Legally safe, but a competitor calls them the same afternoon.":"They source elsewhere."]);}
      else {fx.trust-=2;lines.push(["m",`${c[1].split(" ·")[0]} heard nothing`,"They call the CEO directly."]);} });
    if(broken){fx.trust-=5*broken;lines.push(["b",`${broken} promise${broken>1?"s":""} of full volume you cannot keep`,"Logged for the Board review."]);}
    const rs=(document.querySelector("input[name=rs]:checked")||{}).value;
    if(rs==="48"){fx.cont+=6;fx.safety+=3;lines.push(["g","Line 2 back at T+52h after sign-off","Sister-plant volume bridges the gap."]);}
    else if(rs==="24"){fx.safety-=10;fx.trust-=4;fx.cont+=2;lines.push(["b","Early restart triggered a near-miss","Inspectors suspend Hall A for two days."]);}
    else {fx.cont-=8;lines.push(["m","Everything stays stopped","Safe, but the shortfall doubles."]);}
    S.facts.supplyOK=crit>=.8&&!broken;
    finishScene({fx,lines,head:crit>=.8&&!broken?"Customers have a plan they can believe":"Supply is stretched and promises are at risk",sub:`${used.toLocaleString()} of ${CAP.toLocaleString()} m³ allocated.`,lesson:"Continuity is planned, not improvised. Know your critical customers and recovery times (Business Impact Analysis), then make promises you can keep. Over-promising moves the crisis a few days down the road."});
  });
  startClock(sc.mins,false);
}

/* ---------- Scene 5: bank ---------- */
function scBank(sc){
  const QS=[["q1","What does your credit committee need on Tuesday?","A clear impact range and a recovery timeline. Not perfect numbers, a credible range.","Needs a range, not perfection"],
   ["q2","What worried you most this morning?","I learned about it from the press. After the restructuring we were promised no surprises.","Wants no surprises"],
   ["q3","How does insurance affect your view?","If the loss is insured and the claim is lodged, the exposure looks very different to the committee.","Insurance changes the exposure"],
   ["q4","What would make you comfortable?","A named contact and regular written updates until production is back to normal.","Wants a named contact and updates"]];
  const PROPS=[["range","Share the impact range now: 10–14 days of lost output and an estimated KD range, with a recovery timeline","q1",14,"That is exactly what the committee needs."],
   ["sorry","Apologise for the late call and commit to no surprises from here","q2",12,"Thank you. That matters more than you might think."],
   ["ins","Confirm the insurance claim will be lodged within 48 hours, with the broker’s confirmation","q3",12,"Good. Send me the broker’s letter."],
   ["weekly","A weekly written update from the CFO, named contact, until full restart","q4",12,"A named contact and a rhythm. I can work with that."],
   ["wait","We will share numbers once they are final","",-12,"So I go into committee with nothing?"],
   ["rel","Remind him of the long relationship between ACICO and the bank","",-2,"I appreciate that, but the committee needs facts."],
   ["chair","Tell him the Chairman will call his CEO if needed","",-15,"Going over my head will not help you."]];
  let stance=25, asked=new Set(), t=180;
  $("#main").innerHTML=sceneHead(sc,"The relationship manager at one of the creditor banks has seen the news. The restructuring agreements are still fresh and his credit committee meets on Tuesday. Listen first: every question reveals what drives him. Then offer up to three proposals.")+
  `<div class="grid2">
   <div class="panel">
    <div class="person"><div class="av">TM</div><div><b style="font-size:17px">Tareq Al-Mansour</b><div class="muted" style="font-size:13px">Senior Relationship Manager &middot; creditor bank (fictional)</div></div></div>
    <div class="bubble" id="say">I saw the news before anyone from ACICO called me. My committee meets on Tuesday. Help me understand why I should not be worried.</div>
    <svg class="gauge" viewBox="0 0 300 160" width="100%" style="max-width:360px;display:block;margin:14px auto 0">
      <path d="M30 140 A120 120 0 0 1 270 140" fill="none" stroke="#ece7e1" stroke-width="18"/>
      <path d="M30 140 A120 120 0 0 1 90 36" fill="none" stroke="#D04437" stroke-width="18" opacity=".5"/>
      <path d="M90 36 A120 120 0 0 1 210 36" fill="none" stroke="#D99A16" stroke-width="18" opacity=".5"/>
      <path d="M210 36 A120 120 0 0 1 270 140" fill="none" stroke="#2E9E6B" stroke-width="18" opacity=".5"/>
      <text x="22" y="158">Opposed</text><text x="132" y="14">Neutral</text><text x="236" y="158">Supportive</text>
      <g id="gn" style="transition:transform .8s cubic-bezier(.3,1.4,.5,1)"><line x1="150" y1="140" x2="150" y2="40" stroke="#262626" stroke-width="4" stroke-linecap="round"/><circle cx="150" cy="140" r="8" fill="#262626"/></g>
    </svg>
    <div class="slotlabel" style="margin-top:10px"><span>What drives him</span><small id="qt">call time 03:00</small></div>
    <div class="interests" id="ints">${QS.map(q=>`<span class="hidden" id="in-${q[0]}">interest not yet revealed</span>`).join("")}</div>
   </div>
   <div>
    <div class="panel"><h4>1 &middot; Listen first <small>each question uses 30 s of the call</small></h4><div class="chipq">${QS.map(q=>`<button class="ask" data-q="${q[0]}"><span style="font-size:14px">${q[1]}</span><small>&minus;30s</small></button>`).join("")}</div></div>
    <div class="panel" style="margin-top:14px" id="bp"><h4>2 &middot; Make your proposals <small>up to three</small></h4>
      <div class="slot" data-slot="offer" data-max="3" data-ph="Drag up to three proposals here" style="min-height:70px"></div>
      <div class="slot" data-slot="pool" data-ph="" style="margin-top:10px;border:0;padding:0">${PROPS.map(p=>`<div class="token" data-id="${p[0]}" style="font-size:13.5px">${esc(p[1])}</div>`).join("")}</div></div>
   </div>
  </div>
  <div class="foot"><span class="muted">Proposals that answer an interest you uncovered land far better.</span>${holdBtn("approve5","Close the call with these proposals")}</div>`;
  const setG=()=>{$("#gn").style.transform=`rotate(${-90+stance*1.8}deg)`;$("#gn").style.transformOrigin="150px 140px";}; setG();
  const qt=()=>{$("#qt").textContent=`call time ${String(Math.floor(Math.max(t,0)/60)).padStart(2,"0")}:${String(Math.max(t,0)%60).padStart(2,"0")}`;};
  $$("#main .ask").forEach(b=>b.onclick=()=>{ const q=QS.find(x=>x[0]===b.dataset.q); if(asked.has(q[0])||t<=0)return; asked.add(q[0]); t-=30; qt(); b.disabled=true; $("#say").textContent=q[2]; $("#say").animate([{opacity:.3},{opacity:1}],{duration:400});
    const el=$("#in-"+q[0]); el.className=""; el.textContent=q[3]; stance=Math.min(100,stance+4); setG(); beep(500,.08); });
  dnd($("#bp"));
  wireHold("approve5",()=>{
    const offer=inSlot($("#bp"),"offer"); const fx={safety:0,trust:0,cont:0},lines=[];
    offer.forEach(id=>{const p=PROPS.find(x=>x[0]===id); let d=p[3]; if(p[2]&&!asked.has(p[2]))d=Math.round(d/2); stance=Math.max(0,Math.min(100,stance+d));
      lines.push([d>6?"g":d>0?"m":"b",p[1].split(",")[0].split(":")[0],`Tareq: “${p[4]}”${p[2]&&!asked.has(p[2])?" (landed weaker: you had not asked what he needed)":""}`]);
      if(id==="weekly")addCommit("Weekly written CFO update to the bank until full restart",5,"pending");
      if(id==="ins")addCommit("Insurance claim lodged within 48 hours",5,"pending");
      if(id==="sorry")addCommit("No surprises for creditor banks",5,"pending");});
    setG(); $("#say").textContent=stance>=70?"Thank you. I can take this to the committee with confidence.":stance>=45?"I will take this to the committee, but they will have questions.":"I will have to recommend that the committee reviews the facility.";
    if(!offer.length)lines.push(["b","No proposals made","The call ends with nothing for the committee."]);
    lines.unshift([asked.size>=3?"g":asked.size>=1?"m":"b",`You asked ${asked.size} question${asked.size===1?"":"s"} before proposing`,asked.size>=3?"You understood his interests before you offered anything.":"You proposed before you understood what he needed."]);
    fx.trust=Math.round((stance-45)/3); fx.cont=Math.round((stance-45)/5);
    lines.push([stance>=70?"g":stance>=45?"m":"b",`Bank stance: ${stance>=70?"supportive":stance>=45?"neutral":"opposed"}`,stance>=70?"The committee notes the recovery plan; the facility is unaffected.":stance>=45?"The committee asks for a formal letter and a meeting.":"The committee puts the facility under review."]);
    S.facts.bank=stance;
    setTimeout(()=>finishScene({fx,lines,head:stance>=70?"The bank is on your side":"The bank is watching closely",sub:"Call closed after "+(180-t)+" seconds of questions.",lesson:"Stakeholder confidence is earned before it is needed. Listen first, answer the interests you uncover, and share a credible range now rather than precision later. Every promise you make becomes part of the record."}),1100);
  });
  qt(); startClock(sc.mins,false);
}

/* ================= RESULTS ================= */
function renderResults(){
  stopClock(); S.scene=SCENES.length; chrome(); $("#clock").textContent="T+72h"; $("#clockLab").innerHTML="board<br>review";
  // resolve pending commitments
  S.commit.forEach(c=>{ if(c.check==="pending")c.check=S.rings.trust>=55?"kept":"at risk"; });
  const R=S.rings; const score=Math.round(R.safety*.4+R.trust*.35+R.cont*.25);
  const verdict=score>=75?["Anchored","The Group held steady. People were protected first, the team took control fast, and stakeholders kept their confidence."]:score>=60?["Steady","A sound response with costly moments. The Board will focus on the scenes marked below."]:score>=45?["Adrift","ACICO came through, but slow or defensive calls cost trust and continuity."]:["Overwhelmed","The crisis led the Group. This is exactly the gap the Crisis Management program is designed to close."];
  const sc=k=>{const r=S.results[k];return r?Object.values(r.fx).reduce((a,b)=>a+b,0):0};
  const comp=[["Decisions under pressure",sc(0),"Day 3 · decisions under uncertainty, decision log",SEATS[1]],["Crisis team structure",sc(1),"Day 2 · crisis team roles, meeting rhythm",SEATS[0]],["Crisis communication",sc(2),"Day 3 · holding statement, bridging",SEATS[2]],["Business continuity",sc(3),"Day 4 · Business Impact Analysis",SEATS[3]],["Stakeholder confidence",sc(4),"Day 3 · stakeholder mapping",SEATS[0]],["Keeping commitments",S.commit.length?Math.round((S.commit.filter(c=>c.check==="kept").length/S.commit.length-.5)*40):0,"Day 4 · lessons-learned review",SEATS[4]]];
  const pct=v=>Math.max(5,Math.min(100,50+v*2.2));
  $("#main").innerHTML=`<div class="shead"><div><div class="eyebrow">T+72:00 &middot; the Board review</div><h2>${esc(S.team)}: how did the Group come through?</h2><p>The Board reads your decisions, your log and every commitment made in ACICO&rsquo;s name. Use this screen for the team debrief with your facilitator.</p></div></div>
  <div class="grid2">
   <div class="card" style="display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center"><div><div class="eyebrow">Crisis readiness</div><div class="score" id="sc">0</div></div><div><div class="verdict">${verdict[0]}</div><p class="muted" style="margin:6px 0 12px">${verdict[1]}</p>
     <div style="display:flex;gap:16px;flex-wrap:wrap">${RINGS.map(([k,l,,hex])=>`<div class="ring">${ringSVG(R[k],hex)}<div><b>${R[k]}</b><small>${l}</small></div></div>`).join("")}</div></div></div>
   <div class="card"><h3 style="font-size:19px;margin-bottom:6px">Commitments made in ACICO&rsquo;s name</h3>
     ${S.commit.length?S.commit.map(c=>`<div class="cm"><span>${esc(c.text)} <small class="muted">&middot; scene ${c.scene}</small></span><span class="badge ${c.check==="kept"?"k":c.check==="broken"?"r":"p"}">${c.check==="kept"?"KEPT":c.check==="broken"?"BROKEN":"AT RISK"}</span></div>`).join(""):`<p class="muted">No commitments were made. Customers and banks noticed the silence.</p>`}</div>
  </div>
  <h3 style="font-size:20px;margin:22px 0 10px">Competency map &middot; linked to the Crisis Management program days</h3>
  <div class="comp">${comp.map(c=>`<div class="cp"><b>${c[0]}</b><div class="bar"><i style="width:${pct(c[1])}%;background:${pct(c[1])>=65?"var(--good)":pct(c[1])>=45?"var(--warn)":"var(--bad)"}"></i></div><small>${c[2]}<br>Lead seat: ${esc(seatName(c[3].id))}</small></div>`).join("")}</div>
  <h3 style="font-size:20px;margin:22px 0 10px">Scene by scene</h3>
  <div class="tl">${SCENES.map((s,i)=>{const r=S.results[i],t=sc(i);return `<div class="tlr"><span class="mono" style="font-size:12.5px;color:var(--orange-d)">${s.at.split(" ·")[0]}</span><div><b>${s.title}</b> <span class="muted">&middot; ${r?esc(r.head):"not played"}</span><br><small class="muted">Owner: ${esc(seatName(s.owner))}</small></div><span class="g" style="color:${t>=10?"var(--good)":t>=0?"var(--warn)":"var(--bad)"}">${t>0?"+":""}${t} pts</span></div>`}).join("")}</div>
  <div class="card" style="margin-top:20px;display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap;background:linear-gradient(90deg,#fff,var(--orange-l))">
   <div><div class="eyebrow">Knowledge Group &middot; Crisis Management program, Day 4</div><h3 style="font-size:22px">In the classroom, this runs as a live team exercise</h3><p class="muted" style="margin:6px 0 0;max-width:70ch">Five ACICO participants take the seats, a facilitator adds live injects, and the review is built from the team&rsquo;s own decision log and commitments.</p></div>
   <div style="display:flex;gap:10px"><button class="btn" id="again">Play again</button><button class="btn ghost" id="home">Back to the briefing</button></div></div>`;
  let n=0;const el=$("#sc");const iv=setInterval(()=>{n+=2;if(n>=score){n=score;clearInterval(iv);}el.textContent=n;},18);
  $("#again").onclick=()=>{S.rings={safety:50,trust:50,cont:50};S.commit=[];S.results=[];S.facts={};S.scene=0;alarm();renderScene();};
  $("#home").onclick=renderIntro; window.scrollTo({top:0,behavior:"smooth"});
}

/* ================= GLOBAL ================= */
$("#snd").onclick=()=>{S.sound=!S.sound;$("#snd").innerHTML=S.sound?"&#128266;":"&#128263;";};
$("#fs").onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{});}catch(e){}};
renderIntro();
})();
</script>
</body>
</html>
